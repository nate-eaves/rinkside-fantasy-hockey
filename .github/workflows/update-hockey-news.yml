name: Refresh Rinkside news
on:
  push:
    paths:
      - .github/workflows/update-hockey-news.yml
      - update_news.py
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fantasy-hockey-news
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build news snapshot
        run: python update_news.py
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "News snapshot did not change."
          else
            git commit -m "Refresh fantasy hockey news"
            git pull --rebase origin main
            git push
          fi
